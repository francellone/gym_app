<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffedd5" />
    <!-- Descripción bilingüe: el HTML es estático (no sabemos el idioma del visitante).
         El atributo lang de <html> se actualiza en runtime desde src/i18n. -->
    <meta
      name="description"
      content="App de gestión de entrenamiento para coach y alumnos · Training management app for coaches and athletes"
    />
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS / Safari -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GymCoach" />
    <title>GymCoach</title>
    <!-- Tema claro/oscuro antes de pintar (evita el destello claro de noche).
         Misma lógica que src/theme/theme.js. -->
    <script>
      try {
        var m = localStorage.getItem('gymcoach.theme') || 'system'
        var d =
          m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (d) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1b1b1b')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
